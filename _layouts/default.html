<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Georgia, serif;
      background: #faf8f5;
      color: #2c2420;
      line-height: 1.7;
      padding: 3rem 1.5rem;
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: normal;
      letter-spacing: 0.06em;
    }

    nav a {
      color: #2c2420;
      text-decoration: none;
      text-transform: lowercase;
      margin-left: 1rem;
    }

    nav a:hover { text-decoration: underline; }

    hr {
      border: none;
      border-top: 1px solid #d6cec6;
      margin: 1.5rem 0 2.5rem 0;
    }

    main { margin-bottom: 3rem; }

    h2 {
      font-size: 1rem;
      font-weight: normal;
      margin-bottom: 0.75rem;
    }

    p { margin-bottom: 1rem; }

    a { color: #2c2420; }

    .about { display: flex; gap: 2rem; align-items: flex-start; }
    .about img { width: 180px; border-radius: 4px; }
    .about .text { flex: 1; }

    .post-list { list-style: none; }

    .post-list li { margin-bottom: 0.75rem; }

    .post-list a { text-transform: lowercase; }

    .post-list time {
      display: inline-block;
      margin-left: 0.5rem;
      opacity: 0.5;
      font-size: 0.875rem;
    }

    .voice {
      font-style: italic;
      opacity: 0.65;
      margin-bottom: 1.5rem;
    }

    .music-list { list-style: none; }
    .music-list li {
      margin-bottom: 0.4rem;
      padding-left: 1.25rem;
      position: relative;
    }
    .music-list li::before {
      content: "—";
      position: absolute;
      left: 0;
      opacity: 0.35;
    }
    .music-list + h2 { margin-top: 2.5rem; }
    .music-list .collaborators {
      display: block;
      font-size: 0.85rem;
      font-style: italic;
      opacity: 0.5;
    }

    .post-title { margin-bottom: 0.25rem; }
    .post-date {
      font-size: 0.85rem;
      opacity: 0.5;
      margin-bottom: 2rem;
    }

    pre {
      background: #f0ebe5;
      padding: 1rem 1.25rem;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 0.85rem;
      line-height: 1.5;
      margin-bottom: 1rem;
    }

    code {
      font-family: "SF Mono", Menlo, monospace;
      font-size: 0.85em;
    }

    :not(pre) > code {
      background: #f0ebe5;
      padding: 0.15em 0.35em;
      border-radius: 3px;
    }

    blockquote {
      border-left: 2px solid #d6cec6;
      padding-left: 1rem;
      margin-bottom: 1rem;
      font-style: italic;
      opacity: 0.75;
    }

    main img {
      max-width: 100%;
      border-radius: 4px;
      margin: 1rem 0;
    }

    .caption {
      font-size: 0.8rem;
      font-style: italic;
      opacity: 0.5;
      text-align: center;
      margin-top: -0.5rem;
      margin-bottom: 1.5rem;
    }

    h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-top: 2rem;
      margin-bottom: 0.5rem;
    }

    ol, ul { margin-bottom: 1rem; }
    li { margin-bottom: 0.25rem; }

    footer { display: flex; gap: 1rem; align-items: center; }
    footer a { opacity: 0.4; transition: opacity 0.15s; }
    footer a:hover { opacity: 0.8; text-decoration: none; }
    footer svg { width: 16px; height: 16px; fill: #2c2420; }

    @media (max-width: 600px) {
      .about { flex-direction: column; }
      .about img { width: 200px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>{{ site.title }}</h1>
    <nav>
      <a href="/">about</a>
      <a href="/log/">log</a>

    </nav>
